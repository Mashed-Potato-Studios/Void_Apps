name: Release void-fingerprint

on:
  push:
    tags:
      - "void-fingerprint-v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#void-fingerprint-v}"
          PKG="$(node -p "require('./packages/void-fingerprint/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi

      - name: Build, typecheck, test
        run: |
          pnpm --filter void-fingerprint build
          pnpm --filter void-fingerprint typecheck
          pnpm --filter void-fingerprint test

      - name: Publish to npm
        # First release: needs NPM_TOKEN (granular access token, publish
        # permission). After configuring a trusted publisher on npmjs.com,
        # OIDC takes over via id-token:write + --provenance — delete the
        # secret and drop the NODE_AUTH_TOKEN block below.
        run: pnpm --filter void-fingerprint publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
